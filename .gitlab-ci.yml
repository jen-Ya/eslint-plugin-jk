image: node:22

stages:
  - prepare
  - build
  - publish

variables:
  # point npm at your custom .npmrc
  NPM_CONFIG_USERCONFIG: "$CI_PROJECT_DIR/.npmrc"
  # tell asdf to skip the .tool-versions file and use the container’s Node install
  ASDF_NODEJS_VERSION: "system"

prepare:
  stage: prepare
  script:
    # create .npmrc pointing @q1 to your GitLab registry
    - |
      cat > .npmrc <<EOF
      @q1:registry=https://git.zahlz.com/api/v4/projects/454/packages/npm/
      //git.zahlz.com/api/v4/projects/454/packages/npm/:_authToken=${GITLAB_CI_TOKEN}
      EOF
    - npm ci

build:
  stage: build
  script:
    - npm run tsc

publish:
  stage: publish
  only:
    - tags
  script:
    # set package name
    - npm pkg set name=@q1/eslint-plugin-jk
    - npm publish
